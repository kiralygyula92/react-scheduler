version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # react and react-dom must have the exact same version, or every test fails to load: they
      # move in one pull request, with their type definitions. The first matching group wins.
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      dev-dependencies:
        dependency-type: development
    open-pull-requests-limit: 5
    ignore:
      # Node type definitions track the Node version the repo runs, so that code cannot use APIs
      # the runtime does not have.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # axe-core 4.14 turns on label-content-name-mismatch, which the cards and chips fail: held at
      # 4.13 until GAPS G16 is decided.
      - dependency-name: 'axe-core'
        versions: ['>=4.14.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
