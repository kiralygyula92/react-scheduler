# docs pack 10 §5.1. Steps whose tooling lands in later milestones are added there
# (docs api M5–M6): see EXCEPTIONS.md #1.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        react: ['18.2', '18.3', '19']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the commit-message scan needs the history of the range
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @react-schedulerkit/react-scheduler add -D react@${{ matrix.react }} react-dom@${{ matrix.react }}
        if: matrix.react != '19'
      # The reference pages and their data are generated: lint, typecheck and the build all read
      # them, so the extractor runs before the first of them (docs pack 05 §2).
      - run: pnpm --filter docs api
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage # enforces the coverage thresholds (M1 gate: core ≥ 90 % lines, 85 % branches)
      - run: pnpm check:licenses
      - run: pnpm check:zero-reference
      - name: Zero-reference scan of commit messages
        shell: bash
        run: git log --format=%B "$RANGE" | pnpm --silent check:zero-reference --stdin
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
      - run: pnpm check:keys
      - run: pnpm check:scenarios --enforce
      - run: pnpm knip
      - run: pnpm --filter @react-schedulerkit/react-scheduler build
      - run: pnpm --filter @react-schedulerkit/react-scheduler size
      - run: pnpm check:pack
      - run: pnpm --filter @react-schedulerkit/react-scheduler lint:pkg
      # The site: the package it documents is already built above.
      - run: pnpm --filter docs i18n:check
        if: matrix.react == '19'
      - run: pnpm --filter docs build
        if: matrix.react == '19'
      - run: pnpm --filter docs conformance
        if: matrix.react == '19'
      - run: pnpm --filter docs check:links
        if: matrix.react == '19'
      - run: pnpm exec playwright install --with-deps
        if: matrix.react == '19'
      # Scenarios, computed styles and accessibility in Chromium, Firefox and WebKit. The screenshot
      # comparison only writes its captures here: the references are Windows renderings (job below).
      - run: pnpm test:browser
        if: matrix.react == '19'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && matrix.react == '19'
        with:
          name: screenshots-linux
          path: packages/react-scheduler/test-results/shot/
          if-no-files-found: ignore
      # The site's journeys in three engines, against the built static output. The shell's visual
      # baselines are Windows renderings and skip here (visual job below).
      - run: pnpm e2e apps/docs/e2e
        if: matrix.react == '19'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && matrix.react == '19'
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
  visual:
    # The screenshot gate (Feature Dossier 09 §4) on the references' platform (ADR 0003 D9).
    # Non-blocking until a first green run confirms this runner rasterizes like the reference machine.
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm test:browser test/browser/shot test/browser/vis
        env:
          RS_BROWSERS: chromium
      # The docs shell's baselines were recorded on Windows for the same reason.
      - run: pnpm --filter @react-schedulerkit/react-scheduler build
      - run: pnpm --filter docs api
      - run: pnpm --filter docs build
      - run: pnpm e2e apps/docs/e2e/visual.spec.ts --project=chromium
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: screenshots-windows
          path: packages/react-scheduler/test-results/shot/
          if-no-files-found: ignore
