# Pushing a v* tag on main stages that version on npm through trusted publishing: there is no npm
# token, and the package gets provenance. A staged version goes live only after a maintainer
# approves it on npmjs.com. See RELEASING.md. Before anything is staged, the packed tarball passes
# the zero-reference scan (Feature Dossier 09 §7) and the release sandbox (EXCEPTIONS.md #3).
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm # only v* tags may deploy here (repo settings)
    permissions:
      contents: read
      id-token: write # short-lived identity for npm trusted publishing
    env:
      LIB_DIR: packages/react-scheduler # folder that holds the library's package.json
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Only GitHub-made actions may run in this repository, so pnpm (the version in package.json's
      # `packageManager`) is installed with the runner's npm, as in ci.yml.
      - name: Install pnpm
        run: npm install -g "$(node -p "require('./package.json').packageManager")"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never cache in release builds
      - name: Tagged commit must be on the default branch
        run: git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"
      - name: Tag must match package.json version
        working-directory: ${{ env.LIB_DIR }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($expected)"
            exit 1
          fi
      - name: Install npm 11 # pinned, like the actions
        run: npm install -g npm@11.19.0
      - name: npm must support staged publishing (11.15.0+)
        run: |
          npm -v
          node -e "const [a,b]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&b>=15)?0:1)" "$(npm -v)"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm run --if-present test
        working-directory: ${{ env.LIB_DIR }}
      - name: Build
        run: pnpm run build
        working-directory: ${{ env.LIB_DIR }}
      - name: Zero-reference scan of the package tarball
        shell: bash
        run: |
          pnpm --filter @kingtech/react-scheduler pack --pack-destination "$RUNNER_TEMP/pack"
          mkdir -p "$RUNNER_TEMP/pack/contents"
          tar -xzf "$RUNNER_TEMP"/pack/*.tgz -C "$RUNNER_TEMP/pack/contents"
          pnpm check:zero-reference --dir "$RUNNER_TEMP/pack/contents"
      # The tarball in fresh React 19 and React 18.2 applications, type-checked with every TypeScript
      # version the Requirements page promises, before anything reaches the registry.
      - name: Release sandbox
        run: pnpm release:sandbox
      - name: Stage on npm (goes live only after you approve on npmjs.com)
        run: npm stage publish
        working-directory: ${{ env.LIB_DIR }}
