# docs pack 10 §5.2, plus two guards: the job runs only when the repository variable
# RELEASE_ENABLED is 'true' (set at M8, EXCEPTIONS.md #3), and the packed tarball passes the
# zero-reference scan before anything is published (Feature Dossier 09 §7).
name: Release
on:
  push:
    branches: [main]
  # Run by hand once the npm side exists (docs/release/npm.md §4.1): enabling the workflow is not a
  # push, so without this the first release would wait for an unrelated commit.
  workflow_dispatch:
concurrency: release
permissions:
  contents: write
  pull-requests: write
  id-token: write # OIDC for npm Trusted Publishing and provenance
jobs:
  release:
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: pnpm, registry-url: 'https://registry.npmjs.org' }
      - run: npm install -g npm@11.19.0 # Trusted Publishing needs npm >= 11.5.1; pinned, like the actions
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @react-schedulerkit/react-scheduler build
      - name: Zero-reference scan of the package tarball
        shell: bash
        run: |
          pnpm --filter @react-schedulerkit/react-scheduler pack --pack-destination "$RUNNER_TEMP/pack"
          mkdir -p "$RUNNER_TEMP/pack/contents"
          tar -xzf "$RUNNER_TEMP"/pack/*.tgz -C "$RUNNER_TEMP/pack/contents"
          pnpm check:zero-reference --dir "$RUNNER_TEMP/pack/contents"
      # The tarball in fresh React 19 and React 18.2 applications, type-checked with every TypeScript
      # version the Requirements page promises, before anything reaches the registry.
      - run: pnpm release:sandbox
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN: ${{ secrets.NPM_TOKEN }}   # only for the granular-token fallback
